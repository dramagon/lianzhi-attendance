name: lianzhi-c
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lianzhi
      MYSQL_USER: lianzhi
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u lianzhi -D lianzhi -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/lianzhi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: lianzhi
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AVATAR_DIRECTORY: /app/data/avatars
      LIANZHI_FACE_ENABLED: "false"
      LIANZHI_FACE_REQUIRED: "false"
      LIANZHI_KNOWLEDGE_ENABLED: "true"
      LIANZHI_AI_BASE_URL: ${LIANZHI_AI_BASE_URL:-}
      LIANZHI_AI_MODEL: ${LIANZHI_AI_MODEL:-}
      LIANZHI_AI_TIMEOUT_SECONDS: ${LIANZHI_AI_TIMEOUT_SECONDS:-45}
      LIANZHI_EMBEDDING_BASE_URL: ${LIANZHI_EMBEDDING_BASE_URL:-}
      LIANZHI_EMBEDDING_MODEL: ${LIANZHI_EMBEDDING_MODEL:-}
      LIANZHI_EMBEDDING_REVISION: ${LIANZHI_EMBEDDING_REVISION:-1}
      LIANZHI_OCR_URL: ${LIANZHI_OCR_URL:-}
      LIANZHI_OCR_TOKEN: ${LIANZHI_OCR_TOKEN:-}
      LIANZHI_TRANSCRIPTION_URL: ${LIANZHI_TRANSCRIPTION_URL:-}
      LIANZHI_TRANSCRIPTION_TOKEN: ${LIANZHI_TRANSCRIPTION_TOKEN:-}
      TZ: Asia/Shanghai
    volumes:
      - avatar-data:/app/data/avatars
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  mysql-data:
  avatar-data:
