server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://webapi.amap.com https://webapi.amap.com.cn; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; media-src 'self' blob:; connect-src 'self' https://*.amap.com https://*.amap.com.cn https://*.autonavi.com; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location /assets/ { try_files $uri =404; expires 1h; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
