spring:
  autoconfigure:
    # Redis sessions are explicitly opt-in; dependencies alone must not replace local sessions.
    exclude:
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  application:
    name: lianzhi-attendance
  profiles:
    default: demo
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${LIANZHI_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: statement
lianzhi:
  session:
    redis:
      enabled: ${LIANZHI_REDIS_ENABLED:false}
      host: ${LIANZHI_REDIS_HOST:127.0.0.1}
      port: ${LIANZHI_REDIS_PORT:6379}
      database: ${LIANZHI_REDIS_DATABASE:0}
      username: ${LIANZHI_REDIS_USERNAME:}
      password: ${LIANZHI_REDIS_PASSWORD:}
      tls: ${LIANZHI_REDIS_TLS:false}
      namespace: ${LIANZHI_REDIS_NAMESPACE:lianzhi:session:v1}
      connect-timeout: ${LIANZHI_REDIS_CONNECT_TIMEOUT:1s}
      command-timeout: ${LIANZHI_REDIS_COMMAND_TIMEOUT:1s}
  demo: false
  avatar-directory: ${AVATAR_DIRECTORY:./data/avatars}
  face:
    arcsoft:
      enabled: ${LIANZHI_ARCSOFT_ENABLED:false}
      jar: ${LIANZHI_ARCSOFT_JAR:}
      native-directory: ${LIANZHI_ARCSOFT_NATIVE_DIRECTORY:}
      app-id: ${LIANZHI_ARCSOFT_APP_ID:}
      sdk-key: ${LIANZHI_ARCSOFT_SDK_KEY:}
      rgb-liveness-threshold: ${LIANZHI_ARCSOFT_RGB_LIVENESS_THRESHOLD:0.8}
    enabled: ${LIANZHI_FACE_ENABLED:false}
    required-for-punch: ${LIANZHI_FACE_REQUIRED:false}
    encryption-key: ${LIANZHI_FACE_ENCRYPTION_KEY:}
    minimum-score: ${LIANZHI_FACE_MINIMUM_SCORE:-1}
