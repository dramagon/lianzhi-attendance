name: C容器集成验证
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-origin-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 构建镜像并验证同源登录、V6、解析、检索与重启
        run: python scripts/test-c-compose.py
      - name: 保存合成验收结果与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-container-verification
          path: |
            artifacts/lianzhi-c-verify-*/result.json
            artifacts/lianzhi-c-verify-*/*.log
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: lianzhi-verify
      - name: 部署同源应用并验证 MySQL、重启与 PVC
        run: python3 scripts/test-c-kubernetes.py --cluster lianzhi-verify
      - name: 记录集群诊断
        if: failure()
        run: |
          kubectl --context kind-lianzhi-verify -n lianzhi get pods,svc,pvc
          kubectl --context kind-lianzhi-verify -n lianzhi get events
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-kubernetes-verification
          path: artifacts/c-kubernetes/
