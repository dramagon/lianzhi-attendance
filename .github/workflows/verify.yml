name: 第一阶段验证

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 后端测试与打包
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: 安装前端依赖并构建
        working-directory: frontend
        run: npm ci && npm run build && node scripts/build-intelligence.mjs
      - name: 安装测试浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 启动演示后端
        run: |
          java -jar backend/target/lianzhi-backend-0.1.0.jar > /tmp/backend.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/system/info > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1
      - name: 三角色浏览器测试
        working-directory: frontend
        run: npm run test:e2e
